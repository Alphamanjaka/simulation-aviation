<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Sim Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="main-menu">
        <h1>Choisissez votre simulation</h1>
        <div class="menu-cards">
            <div class="menu-card" id="start-takeoff">
                <h2>Décollage</h2>
                <p>Gagnez de la vitesse et décollez avant la fin de la piste.</p>
            </div>
            <div class="menu-card" id="start-landing">
                <h2>Atterrissage</h2>
                <p>Prenez les commandes après le pilote automatique et atterrissez en toute sécurité.</p>
            </div>
        </div>
    </div>

    <!-- Le script principal du jeu, utilisant les modules ES6 pour importer les autres fichiers. -->
    <script type="module" src="js/script.js"></script>
</body>

</html>
